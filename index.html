<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 나만의 포켓몬 찾기 ⚡✨</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-cream: #FFFDF0;
            --bg-card: #FEF9E7;
            --primary-yellow: #FFDC00;
            --secondary-amber: #FFB703;
            --accent-orange: #FF9F1C;
            --text-dark: #332C1E;
            --text-muted: #6B5E4B;
            --shadow-soft: 0 8px 24px rgba(212, 163, 89, 0.15);
            --shadow-hover: 0 12px 30px rgba(255, 183, 3, 0.3);
            --border-color: #F3E5AB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px 48px 16px;
            background-image: radial-gradient(#FFE893 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding: 20px 10px;
        }

        .title-badge {
            display: inline-block;
            background: #FFE893;
            color: #8A5A00;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            word-break: keep-all;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
            text-align: center;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        @media (max-width: 520px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 {
                font-size: 1.8rem;
            }
        }

        .mbti-btn {
            background-color: #FFFFFF;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 8px;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .mbti-btn .sub-text {
            font-size: 0.75rem;
            font-weight: 500;
            color: #9C8C74;
        }

        .mbti-btn:hover {
            transform: translateY(-3px);
            border-color: var(--secondary-amber);
            background-color: #FFFDF7;
            box-shadow: var(--shadow-hover);
        }

        .mbti-btn:active {
            transform: translateY(0);
        }

        .mbti-btn.selected {
            background: linear-gradient(135deg, var(--primary-yellow), var(--secondary-amber));
            border-color: var(--secondary-amber);
            color: #000000;
            box-shadow: 0 6px 18px rgba(255, 183, 3, 0.4);
        }

        .mbti-btn.selected .sub-text {
            color: #4A3500;
        }

        .result-container {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease-out;
        }

        .result-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-yellow), var(--accent-orange));
        }

        .badge-mbti {
            display: inline-block;
            background: #FFF0B3;
            color: #8A5A00;
            font-weight: 800;
            font-size: 1rem;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .pokemon-emoji {
            font-size: 5rem;
            margin: 12px 0;
            line-height: 1;
            display: inline-block;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
            animation: floatEmoji 3s ease-in-out infinite;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .pokemon-name {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .type-badge {
            display: inline-block;
            background-color: #EFE6CD;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .pokemon-desc {
            background-color: #FFFFFF;
            border-radius: 18px;
            padding: 20px 18px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            text-align: left;
            word-break: keep-all;
            border-left: 4px solid var(--secondary-amber);
        }

        .chemistry-box {
            background: linear-gradient(135deg, #FFF9EB, #FFF2D6);
            border: 1.5px dashed #E3C886;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .chemistry-title {
            text-align: left;
        }

        .chemistry-title span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .chemistry-title strong {
            font-size: 1.05rem;
            color: var(--text-dark);
        }

        .chemistry-partner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            padding: 8px 14px;
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .chemistry-partner .partner-emoji {
            font-size: 1.5rem;
        }

        .chemistry-partner .partner-info {
            text-align: left;
        }

        .chemistry-partner .partner-mbti {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .chemistry-partner .partner-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn-retry {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary-amber), var(--accent-orange));
            color: #FFFFFF;
            border: none;
            border-radius: 18px;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(255, 159, 28, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>

            <div class="result-container" id="resultContainer">

                    <div class="pokemon-desc" id="resDesc">

                    <div class="chemistry-box">

                            <span>환상의 환콤 궁합</span>
                            <strong>최고의 찰떡 궁합</strong>

                    </div>

                    <button class="btn-retry" id="btnRetry">
                        🔄 다시 고르기
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 MBTI 포켓몬 매칭 | 초보자도 쉽게 즐기는 포켓몬 성격 테스트</p>
        </footer>
    </div>

        // DOM Elements
        const gridBtns = document.querySelectorAll('.mbti-btn');
        const resultContainer = document.getElementById('resultContainer');
        const resMbti = document.getElementById('resMbti');
        const resEmoji = document.getElementById('resEmoji');
        const resName = document.getElementById('resName');
        const resType = document.getElementById('resType');
        const resDesc = document.getElementById('resDesc');
        const chemEmoji = document.getElementById('chemEmoji');
        const chemMbti = document.getElementById('chemMbti');
        const chemName = document.getElementById('chemName');
        const btnRetry = document.getElementById('btnRetry');

        gridBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const selectedMbti = btn.getAttribute('data-mbti');
                
                // Highlight selected button
                gridBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');

                // Render match result
                renderResult(selectedMbti);
            });
        });

        function renderResult(mbti) {
            const data = pokemonData[mbti];
            if (!data) return;

            resMbti.textContent = `${mbti} 유형`;
            resEmoji.textContent = data.emoji;
            resName.textContent = data.name;
            resType.textContent = data.type;
            resDesc.textContent = data.desc;

            // Render Chemistry Partner
            chemEmoji.textContent = data.bestMatch.emoji;
            chemMbti.textContent = data.bestMatch.mbti;
            chemName.textContent = data.bestMatch.name;

            // Show animation
            resultContainer.classList.add('show');

            // Smooth scroll into result view
            setTimeout(() => {
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Retry / Reset behavior
        btnRetry.addEventListener('click', () => {
            resultContainer.classList.remove('show');
            gridBtns.forEach(b => b.classList.remove('selected'));
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
